<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Fake News Detector</title>

    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <!-- Header -->
    <div class="header">

        <h2>📰 Fake News Detector</h2>

        <p>
            AI-powered news article analysis
        </p>

    </div>


    <!-- Analyze button -->

    <button id="analyzeBtn">
        🔍 Analyze Current Page
    </button>


    <!-- Status message -->

    <p id="status"></p>


    <!-- Prediction card -->

    <div class="result-card" id="resultCard">

        <p id="result">
            Prediction
        </p>

        <p id="confidence">
            Confidence: --
        </p>


        <!-- Confidence bar -->

        <div class="progress-container">

            <div id="progressBar"></div>

        </div>

    </div>


    <!-- Important words -->

    <div class="words-section" id="wordsSection">

        <h3>
            🧠 Important Words
        </h3>

        <p class="words-description">
            Words that influenced the model's prediction.
        </p>

        <ul id="words"></ul>

    </div>


    <!-- Footer -->

    <div class="footer">

        TF-IDF + Calibrated Linear SVM + LIME

    </div>


    <script src="popup.js"></script>

</body>

</html>
